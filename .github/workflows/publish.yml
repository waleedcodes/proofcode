name: Publish (VS Code Marketplace, Open VSX & npm)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

jobs:
  publish:
    name: Publish Extension
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build & Package Extension
        run: |
          npm run build
          npx --yes @vscode/vsce package --no-dependencies

      - name: Publish to Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath proofcode-*.vsix -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        run: |
          if [ -n "${{ secrets.OVSX_PAT }}" ]; then
            npx --yes ovsx publish proofcode-*.vsix --no-dependencies -p ${{ secrets.OVSX_PAT }}
          else
            npx --yes ovsx publish proofcode-*.vsix --no-dependencies --trusted-publishing
          fi
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to npm Registry
        if: env.NPM_TOKEN != ''
        run: |
          npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
